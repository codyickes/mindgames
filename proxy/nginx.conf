server {
    listen 80;

    root /usr/share/nginx/html;

    # One block per game service; trailing slash on proxy_pass strips the /api/<game> prefix.
    # Mirror these in frontend/vite.config.js.
    location /api/wordle/ {
        proxy_pass http://wordle:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA fallback so vue-router history mode works on refresh
    location / {
        try_files $uri $uri/ /index.html;
    }
}
