name: game-wordle

on:
  push:
    branches: [main]
    paths: ["games/wordle/**", ".github/workflows/game-wordle.yml"]
  pull_request:
    paths: ["games/wordle/**", ".github/workflows/game-wordle.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: games/wordle
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: games/wordle/requirements*.txt
      - run: python3 -m pip install -r requirements-dev.txt
      - run: pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build games/wordle
